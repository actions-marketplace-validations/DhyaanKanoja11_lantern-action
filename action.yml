name: 'Lantern Security Scan'
description: 'Scan active network listeners and Docker containers for unintentional wildcard port bindings (0.0.0.0)'
author: 'Dhyaan Kanoja'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'Version of Lantern to install (default: "latest")'
    required: false
    default: 'latest'
  fail-on-wildcard:
    description: 'Fail the workflow step if any service is bound to a wildcard address (0.0.0.0 or ::)'
    required: false
    default: 'true'
  ignore-ports:
    description: 'Comma-separated list of ports to ignore for failure checks (e.g. "80,443")'
    required: false
    default: ''
  sarif-file:
    description: 'Output path to save OASIS SARIF v2.1.0 security report for GitHub Code Scanning'
    required: false
    default: ''
  patch-file:
    description: 'Output path to save unified Git remediation diff patch (e.g. "lantern-fix.patch")'
    required: false
    default: ''
  format:
    description: 'Output format for CLI stdout (text, json, sarif)'
    required: false
    default: 'text'

outputs:
  has-patch:
    description: 'Whether any remediation patch was generated ("true" or "false")'
    value: ${{ steps.scan.outputs.has-patch }}
  patch-file:
    description: 'Path to generated unified remediation patch file'
    value: ${{ steps.scan.outputs.patch-file }}

runs:
  using: 'composite'
  steps:
    - name: Install Lantern
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          TAG=$(curl -sSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/DhyaanKanoja11/Lantern/releases/latest | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        else
          TAG="$VERSION"
        fi
        if [[ ! "$TAG" =~ ^v ]]; then
          TAG="v$TAG"
        fi
        VER="${TAG#v}"
        ARCH="amd64"
        case "$(uname -m)" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        URL="https://github.com/DhyaanKanoja11/Lantern/releases/download/${TAG}/lantern_${VER}_linux_${ARCH}.tar.gz"
        echo "Installing Lantern ${TAG} (${ARCH}) from ${URL}..."
        curl -fsSL "${URL}" -o /tmp/lantern.tar.gz
        tar -xzf /tmp/lantern.tar.gz -C /tmp/
        sudo mv /tmp/lantern /usr/local/bin/lantern
        sudo chmod +x /usr/local/bin/lantern
        rm -f /tmp/lantern.tar.gz
        lantern version

    - name: Run Lantern Scan
      id: scan
      shell: bash
      run: |
        FLAGS=""
        if [ "${{ inputs.fail-on-wildcard }}" = "true" ]; then
          FLAGS="$FLAGS --fail-on-wildcard"
        fi
        if [ -n "${{ inputs.ignore-ports }}" ]; then
          FLAGS="$FLAGS --ignore-ports ${{ inputs.ignore-ports }}"
        fi

        SARIF_FILE="${{ inputs.sarif-file }}"
        if [ -n "$SARIF_FILE" ]; then
          echo "Generating SARIF v2.1.0 report to $SARIF_FILE..."
          lantern scan --format sarif > "$SARIF_FILE" 2>/dev/null || true
          echo "SARIF report generated at $SARIF_FILE"
        fi

        PATCH_FILE="${{ inputs.patch-file }}"
        HAS_PATCH="false"
        if [ -n "$PATCH_FILE" ]; then
          echo "Generating automated remediation patch to $PATCH_FILE..."
          SCAN_JSON=$(lantern scan --format json 2>/dev/null || true)
          PORTS=$(echo "$SCAN_JSON" | grep -o '"port":[0-9]*' | grep -o '[0-9]*' | sort -u)
          > "$PATCH_FILE"
          for P in $PORTS; do
            DIFF_OUT=$(lantern fix "$P" --diff 2>/dev/null || true)
            if [ -n "$DIFF_OUT" ]; then
              echo "$DIFF_OUT" >> "$PATCH_FILE"
              HAS_PATCH="true"
            fi
          done
          if [ "$HAS_PATCH" = "true" ]; then
            echo "Remediation patch successfully generated at $PATCH_FILE"
          else
            echo "No remediable exposures found."
            rm -f "$PATCH_FILE"
            PATCH_FILE=""
          fi
        fi

        echo "has-patch=$HAS_PATCH" >> "$GITHUB_OUTPUT"
        echo "patch-file=$PATCH_FILE" >> "$GITHUB_OUTPUT"

        FORMAT="${{ inputs.format }}"
        if [ -n "$FORMAT" ] && [ "$FORMAT" != "text" ]; then
          FLAGS="$FLAGS --format $FORMAT"
        fi

        echo "Running: lantern scan $FLAGS"
        lantern scan $FLAGS
